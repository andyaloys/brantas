<div class="login-container">
  <!-- Subtle Ambient Decor in Light Theme -->
  <div class="login-bg-glow glow-1"></div>
  <div class="login-bg-glow glow-2"></div>
  <div class="login-grid-pattern"></div>

  <main class="login-card-wrapper" role="main">
    <!-- Main Clean Light Glass Card -->
    <div class="login-card">
      <div class="login-header">
        <div class="emblem-wrapper">
          <img src="logo/brantas-emblem.jpg" alt="Logo BRANTAS" class="brand-emblem-img" />
        </div>
        <h1 class="brand-title">BRANTAS</h1>
        <p class="brand-subtitle">Basis Rekomendasi & Analisis Terpadu Anggaran Sosial</p>
      </div>

      <!-- Error Alert -->
      @if (errorMessage()) {
        <div class="alert-error" role="alert" aria-live="polite">
          <i class="pi pi-exclamation-triangle"></i>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Form Login (Ketik Manual) -->
      <form (ngSubmit)="onSubmit()" class="login-form" novalidate>
        <div class="form-group">
          <label for="input-username" class="form-label">
            <span>Username</span>
          </label>
          <div class="input-wrap">
            <i class="pi pi-user input-icon"></i>
            <input
              id="input-username"
              type="text"
              class="form-input"
              [value]="username()"
              (input)="username.set($any($event.target).value)"
              placeholder="Masukkan username"
              autocomplete="username"
              required />
          </div>
        </div>

        <div class="form-group">
          <label for="input-password" class="form-label">
            <span>Kata Sandi</span>
          </label>
          <div class="input-wrap">
            <i class="pi pi-lock input-icon"></i>
            <input
              id="input-password"
              [type]="showPassword() ? 'text' : 'password'"
              class="form-input"
              [value]="password()"
              (input)="password.set($any($event.target).value)"
              placeholder="Masukkan kata sandi"
              autocomplete="current-password"
              required />
            <button
              type="button"
              class="btn-toggle-eye"
              (click)="toggleShowPassword()"
              [title]="showPassword() ? 'Sembunyikan kata sandi' : 'Tampilkan kata sandi'">
              <i class="pi" [class.pi-eye]="!showPassword()" [class.pi-eye-slash]="showPassword()"></i>
            </button>
          </div>
        </div>

        <button
          type="submit"
          class="btn-submit"
          [disabled]="isSubmitting()">
          @if (isSubmitting()) {
            <i class="pi pi-spin pi-spinner"></i>
            <span>Memverifikasi Otorisasi...</span>
          } @else {
            <span>Login</span>
            <i class="pi pi-arrow-right"></i>
          }
        </button>
      </form>

      <!-- Security Notice -->
      <div class="security-footer-notice">
        <i class="pi pi-info-circle"></i>
        <span>Sistem ini dilindungi enkripsi sesi. Silakan masukkan kredensial resmi.</span>
      </div>
    </div>

    <!-- Official Partner / System Badges -->
    <footer class="login-footer">
      <div class="footer-instansi">
        <span>LAN DATATHON 2026</span>
      </div>
    </footer>
  </main>
</div>
